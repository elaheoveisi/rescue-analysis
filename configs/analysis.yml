paths:
  raw: data/raw # raw XDF files per subject
  interim: data/interim
  processed: data/processed # output of fixations/saccades
  mosaic_src: ../mosaic/src # sibling repo, needed only by optimal_pickup_analysis

analysis:
  offscreen_label: offscreen
  condition_by_category:
    dummy: no_llm
    gemini: llm
    openai: llm
  outputs:
    fixation_aoi_file: fixations_aoi.csv
    aoi_transitions_file: aoi_transitions.csv


entropy_groups:
  Victim: [victim, fake_victim]
  Hazard: [lava]
  Access: [door, key]
  Interface: [info_panel, chat_panel]

# Alt-press (manual help) vs automatic (every-50-step) LLM recommendation
# classification. See analysis/model/help_vs_auto.py.
help_vs_auto:
  exclude_participants: [ P005, P013 ]
  llm_trials: [ gemini, openai ] # dummy has no LLM, so no automatic events -- gemini and openai are pooled, not modeled separately
  auto_interval_steps: 50 # game steps between automatic LLM recommendations
  windows_s: [ 2, 5, 10, 15, 20 ] # seconds of look-back before each event
  min_fixations: 2 # below this, SGE/GTE for that window are left null
  recent_window_s: 2 # look-back for the recency-weighted "recent_*_dwell_fraction" features
  n_balance_repeats: 10 # repeats of majority-class downsampling, averaged
  ablation_n_repeats: 5 # same, but for ablation_auc -- reruns once per feature, so kept lower than n_balance_repeats
  random_state: 42
 
  rf_n_estimators: 300 # trees per LOSO fold fit (run_classifiers)
  rf_shap_n_estimators: 500 # trees for the single fit used in shap_values
  rf_max_depth: 3
  rf_min_samples_leaf: 10
  rf_random_state: 0
  classification_threshold: 0.5 # predicted-probability cutoff for label=1 (Alt) in _score and confusion_matrices
  events_file: help_vs_auto_events.csv
  features_file: help_vs_auto_features.csv
  results_file: help_vs_auto_classifier_results.csv
  shap_file: help_vs_auto_shap_values.csv
  confusion_matrix_file: help_vs_auto_confusion_matrix.csv
  ablation_file: help_vs_auto_ablation.csv

  features:
    [
      # -- not AOI-based: pure eye-movement kinematics, independent of what was being looked at --
      #sge, gte,
      fixation_rate_hz,
      mean_fixation_dur_ms,
      max_fixation_dur_ms,
      fixation_dwell_fraction,
      dwell_time_ms,
      n_saccades,
      saccade_rate_hz,
      mean_saccade_dur_ms,
      mean_saccade_amp_px,
      saccade_velocity_px_s,
      peak_saccade_velocity_px_s,
      saccade_amp_sd_px,
      last_saccade_amplitude_px,
      last_saccade_duration_ms,
      last_saccade_velocity_px_s,
      last_saccade_peak_velocity_px_s,
      std_pupil_diam,
      mean_pupil_diameter,
      peak_pupil_diameter,
      pupil_slope_per_s,
      gaze_dispersion_px,
      scanpath_length_rate_px_s,
      blink_rate_hz,

      # -- AOI-based: which entropy_groups category (Victim/Hazard/Access/Interface) gaze moved between --
      #  aoi_transition_rate_hz,
      #  revisit_count,
    ]

xdf:
  game_stream: SARGame
  eye_stream: TobiiEyeTracker
  trial_field: trial_id
  episode_end_fields: [terminated, truncated]

glmm2:
  output_file: glmm2_results.csv
  best_run_metric: saved_victims
  continuous: [
      victims_per_step,
      total_reward,
      mean_fixation_dur_ms,
      std_pupil_diam,
      game_area_pct_dur,
      chat_panel_pct_dur,
    ] # offscreen_pct_dur,
  count: [n_fixations, n_saccades, saved_victims]
  multivariate:
    output_file: glmm2_multivariate_results.csv
    draws: 200
    tune: 200
    chains: 2
    target_accept: 0.9
    random_seed: 42
    coding:
      condition_true: llm
      expertise_true: expert

eyetracker:
  x_col: avg_gaze_point_x # normalized 0-1 (no PsychoPy window set during recording)
  y_col: avg_gaze_point_y # normalized 0-1 (no PsychoPy window set during recording)
  time_col: timestamp
  pupil_col: avg_pupil_diam
  screen_w: 1920 # screen width in pixels  (used to scale normalized -> pixels)
  screen_h: 1080 # screen height in pixels (used to scale normalized -> pixels)
  missing: 0.0 # value used for missing/invalid samples

  channels:
    # column from tobii
    - device_time_stamp
    - avg_gaze_point_x
    - avg_gaze_point_y
    - avg_pupil_diam
    - avg_eye_pos_x
    - avg_eye_pos_y
    - avg_eye_pos_z
    - avg_eye_distance
    - eye_validities

fixation:
  maxdist: 25 # max inter-sample distance in pixels
  mindur: 100 # min fixation duration in ms
  #maxdur:  700   # max fixation duration in ms (removes tracking artifacts)
  columns: [start_ms, end_ms, duration_ms, x, y]

saccade:
  minlen: 10
  maxvel: 80 # pixel/s (alsmost 22 deg/s at 72cm viewing distance) https://link.springer.com/article/10.3758/s13428-013-0422-2?utm_source=chatgpt.com
  maxacc: 1500 # acceleration threshold in pixels/s²   As sampling is 58HZ, https://iopscience.iop.org/article/10.1088/1361-6579/ab159d/ampdf
  columns:
    [
      saccade_id,
      start_ms,
      end_ms,
      duration_ms,
      x_start,
      y_start,
      x_end,
      y_end,
      amplitude,
    ]

aoi:
  # ── Screen-space AOIs ──────────────────────────────────────────────────────
  - name: game_area
    type: dynamic # viewport: fixations mapped to grid tiles at runtime
    x_min: 150
    y_min: 0
    x_max: 1230
    y_max: 1080

  - name: info_panel
    type: static # fixed bounding-box UI panel
    x_min: 1230
    y_min: 0
    x_max: 1770
    y_max: 540

  - name: chat_panel
    type: static # fixed bounding-box UI panel
    x_min: 1230
    y_min: 540
    x_max: 1770
    y_max: 1080

  # ── Grid tile AOIs (identified by game tile ID, inside game_area) ──────────
  # positional: true (default) → label includes grid coords, e.g. victim_3_5
  # positional: false          → label is just the name (many instances, not tracked)
  - name: victim
    type: tile
    tile_id: 5

  - name: fake_victim
    type: tile
    tile_id: 6

  - name: lava
    type: tile
    tile_id: 4

  - name: door
    type: tile
    tile_id_min: 10 # inclusive
    tile_id_max: 28 # exclusive

  - name: key
    type: tile
    tile_id_min: 30 # inclusive
    tile_id_max: 36 # exclusive

  - name: wall
    type: tile
    tile_id: 1
    positional: false # label as "wall", not "wall_x_y" — not tracked per instance
